<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <style>
        .alert{
          margin:12px 0;
          padding:12px 14px;
          border-radius:12px;
          border:1px solid rgba(59,130,246,.35);
          background:linear-gradient(180deg, rgba(59,130,246,.12), rgba(59,130,246,.06));
          color:#e6f0ff;
          box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
          animation:fadeIn .2s ease-out;
          font: 500 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        }
        @keyframes fadeIn{
          from{opacity:0; transform:translateY(-2px)}
          to{opacity:1; transform:none}
        }
    </style>
</head>
<body>
<div th:fragment="flash(msg)">
    <div th:if="${msg}" class="alert">[[${msg}]]</div>
</div>
</body>
</html>
