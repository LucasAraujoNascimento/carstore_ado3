<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - CarStore</title>
    <style>
        :root{
          --bg:#080d1a;
          --surface:#0e152c;
          --border:#1f2a4a;
          --text:#e9edf6;
          --muted:#98a2b3;
          --primary:#22d3ee;
          --primary-600:#06b6d4;
          --danger:#ef4444;
          --shadow: 0 10px 24px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.04);
          --focus: 0 0 0 3px rgba(34,211,238,.35);
        }

        *{box-sizing:border-box}
        html,body{height:100%}
        body{
          margin:0;
          font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
          color:var(--text);
          background:
            radial-gradient(900px 500px at 50% -10%, rgba(34,211,238,.25), transparent 60%),
            radial-gradient(900px 500px at 50% 110%, rgba(99,102,241,.25), transparent 60%),
            var(--bg);
          display:flex;
          align-items:center;
          justify-content:center;
        }

        .login-container{
          width:100%; max-width:420px; padding:20px;
        }

        .login-box{
          background:linear-gradient(180deg, var(--surface), #0b1226);
          border:1px solid var(--border);
          border-radius:20px;
          padding:40px 32px;
          box-shadow:var(--shadow);
        }

        .logo{
          width:56px; height:56px; border-radius:14px; margin:0 auto 20px;
          background:conic-gradient(from 90deg, #22d3ee, #6366f1, #22c55e, #22d3ee);
          box-shadow:0 8px 22px rgba(34,211,238,.4);
        }

        h1{margin:0 0 8px; font-size:28px; text-align:center}
        .subtitle{margin:0 0 32px; color:var(--muted); font-size:14px; text-align:center}

        .field{display:flex; flex-direction:column; gap:8px; margin-bottom:18px}
        .label{font-size:13px; font-weight:600; color:var(--muted)}
        input[type="text"], input[type="password"]{
          width:100%; padding:14px;
          color:var(--text);
          background:#0c1329;
          border:1px solid var(--border);
          border-radius:12px;
          outline:none; transition:.15s border-color, .15s box-shadow;
        }
        input::placeholder{color:#6c7891}
        input:focus{border-color:var(--primary); box-shadow:var(--focus)}

        .btn{
          appearance:none; border:1px solid transparent; cursor:pointer;
          padding:14px; border-radius:12px; font-weight:700; font-size:15px;
          width:100%;
          background:linear-gradient(180deg, var(--primary), var(--primary-600));
          color:#041018;
          box-shadow:0 6px 18px rgba(6,182,212,.35);
          transition:transform .06s ease, filter .15s ease;
        }
        .btn:hover{filter:saturate(1.05) brightness(1.02)}
        .btn:active{transform:translateY(1px)}

        .error{
          background:rgba(239,68,68,.15);
          border:1px solid rgba(239,68,68,.3);
          color:#fca5a5;
          padding:12px;
          border-radius:10px;
          font-size:13px;
          margin-bottom:20px;
        }

        .links{margin-top:24px; text-align:center}
        .links a{color:var(--muted); text-decoration:none; font-size:14px}
        .links a:hover{color:var(--text)}

        .hint{
          margin-top:20px; padding:12px; background:#0c1329; border:1px solid var(--border);
          border-radius:10px; font-size:12px; color:var(--muted); text-align:center;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <div class="logo" aria-hidden="true"></div>
        <h1>Entrar</h1>
        <p class="subtitle">Acesse a área administrativa</p>

        <div th:if="${param.error}" class="error">
            Usuário ou senha inválidos. Tente novamente.
        </div>

        <div th:if="${param.logout}" class="error" style="background:rgba(34,211,238,.15); border-color:rgba(34,211,238,.3); color:#67e8f9">
            Você saiu com sucesso.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label class="label" for="username">Usuário</label>
                <input id="username" type="text" name="username" placeholder="Digite seu usuário" required autofocus />
            </div>

            <div class="field">
                <label class="label" for="password">Senha</label>
                <input id="password" type="password" name="password" placeholder="Digite sua senha" required />
            </div>

            <button class="btn" type="submit">Entrar</button>
        </form>

        <div class="links">
            <a href="/">← Voltar ao catálogo público</a>
        </div>

        <div class="hint">
            <strong>Credenciais de teste:</strong><br/>
            Usuário: <code>admin</code> | Senha: <code>admin123</code>
        </div>
    </div>
</div>
</body>
</html>
